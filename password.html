<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Story</title>
    <link rel="stylesheet" href="password-styles.css">
</head>
<body class="password-page">
    <div class="password-container">
        <!-- Animated Background Hearts -->
        <div class="background">
            <div class="heart heart1">♥</div>
            <div class="heart heart2">♥</div>
            <div class="heart heart3">♥</div>
            <div class="heart heart4">♥</div>
            <div class="heart heart5">♥</div>
            <div class="heart heart6">♥</div>
            <div class="heart heart7">♥</div>
            <div class="heart heart8">♥</div>
        </div>

        <!-- Password Form -->
        <div class="password-box">
            <div class="lock-icon">🔐</div>
            <h1>Our Love Story</h1>
            <p class="subtitle">Enter the date of our special day</p>
            
            <form id="passwordForm" class="password-form">
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="passwordInput" 
                        placeholder="Enter Password"
                        class="password-input"
                        autocomplete="off"
                    >
                    <button type="button" class="toggle-password" id="togglePassword">
                        <span class="toggle-icon">👁️</span>
                    </button>
                </div>
                
                <div id="errorMessage" class="error-message"></div>
                
                <button type="submit" class="submit-btn">
                    <span>Enter</span>
                    <span class="arrow">→</span>
                </button>
            </form>
            
            <div id="successMessage" class="success-message">
                <p>Welcome My Love,<br>Let's Go To The Past 💕</p>
            </div>
        </div>

        <!-- Floating Particles -->
        <div class="particles">
            <div class="particle">✨</div>
            <div class="particle">💕</div>
            <div class="particle">✨</div>
            <div class="particle">💕</div>
            <div class="particle">✨</div>
        </div>
    </div>

    <script src="password-script.js"></script>
</body>
</html>
